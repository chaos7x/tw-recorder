[project]
name = "tw-recorder"
version = "1.7.8"
description = "Multi-Channel Twitch-Stream-Recorder (Streamlink + FFmpeg)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "chaos7x"},
]
keywords = ["twitch", "stream", "recorder", "streamlink", "ffmpeg", "vod", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
]
# Keine Dependencies: tw-recorder.py nutzt ausschließlich die Standardbibliothek
# (urllib statt requests). streamlink ist ein separates CLI-Tool, das per
# Subprocess aufgerufen wird - kein Python-Import, daher keine pyproject.toml-
# Dependency, sondern eigenständig per pip installiert (siehe Dockerfiles).

[project.urls]
Homepage = "https://github.com/chaos7x/tw-recorder"
Repository = "https://github.com/chaos7x/tw-recorder"
Issues = "https://github.com/chaos7x/tw-recorder/issues"

[project.scripts]
tw-recorder = "tw_recorder.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "LOG", "BLE", "PLW1510", "DTZ", "SIM", "PIE", "C4", "EXE", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
