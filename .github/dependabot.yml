# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "docker" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Cooldown: neue Releases erst nach 7 Tagen vorschlagen - ein kompromittiertes
    # Release (wie bei trivy-action, CVE-2026-33634) faellt meist innerhalb von
    # Stunden bis Tagen auf und wird zurueckgezogen. Security-Updates sind davon
    # nicht betroffen und kommen weiterhin sofort.
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

  # Alle Actions in .github/workflows/ sind auf Commit-SHAs gepinnt
  # (`uses: owner/action@<sha> # vX.Y.Z`) statt auf bewegliche Tags/Branches -
  # ein nachtraeglich umgebogener Tag (Supply-Chain-Angriff wie bei
  # trivy-action, CVE-2026-33634) laeuft so nicht unbemerkt in die CI.
  # Dependabot aktualisiert SHA und Versions-Kommentar gemeinsam per PR.
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Cooldown: neue Releases erst nach 7 Tagen vorschlagen - ein kompromittiertes
    # Release (wie bei trivy-action, CVE-2026-33634) faellt meist innerhalb von
    # Stunden bis Tagen auf und wird zurueckgezogen. Security-Updates sind davon
    # nicht betroffen und kommen weiterhin sofort.
    cooldown:
      default-days: 7
