name: Refresh Published Images (Security Patches)

# Baut die bereits veröffentlichten Docker-Images (nur `latest`, NIE die
# fixen vX.Y.Z-Versions-Tags) wöchentlich neu und pusht sie erneut nach
# GHCR - damit profitieren bereits veröffentlichte Images auch von
# Security-Patches, die nach dem letzten echten Release erschienen sind
# (siehe apt-get upgrade/apk upgrade in den Dockerfiles selbst; ohne das
# hier würde ein einmal gepushtes `latest` für immer auf dem Patch-Stand
# seines Build-Zeitpunkts einfrieren). Erstellt bewusst KEIN neues
# GitHub-Release/Git-Tag (im Gegensatz zu docker-release.yml) - das wäre
# bei wöchentlichem Lauf ohne echte Code-Änderung nur Versionshistorie-
# Rauschen. Dockerfile.pyimg wird bewusst nicht veröffentlicht (siehe
# docker-build.yml), daher hier nicht im Matrix.
#
# Räumt danach automatisch das jetzt verwaiste alte `latest`-Digest per
# ghcr-cleanup-action auf (bisher nur manuell über cleanup-ghcr.yaml).

on:
  schedule:
    - cron: '0 7 * * 1'  # Jeden Montag 07:00 UTC (nach docker-build.yml um 06:00)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./Dockerfile
            suffix: ""
          - dockerfile: ./Dockerfile.alpine
            suffix: "-alpine"

    steps:
      - name: Datum ermitteln
        id: date
        run: echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Aktuelle Version ermitteln (kein Auto-Increment)
        id: current_version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Aktuelle Version (unverändert, nur Label-Metadaten): $LATEST_TAG"
          echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Log in zur GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag-Namen definieren
        id: vars
        run: |
          echo "LATEST_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest${{ matrix.suffix }}" >> $GITHUB_ENV

      - name: Docker Image neu bauen und pushen (nur latest, kein neues Release)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ env.LATEST_TAG }}
          provenance: false
          build-args: |
            VERSION=${{ steps.current_version.outputs.version }}
            BUILD_DATE=${{ steps.date.outputs.date }}
          cache-from: type=gha,scope=refresh${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=refresh${{ matrix.suffix }}

  cleanup:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Verwaiste (untagged) GHCR-Images löschen
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: tw-recorder
          delete-untagged: true
          dry-run: false
