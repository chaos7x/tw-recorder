name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least Privilege: dieser Workflow liest nur das Repo (Checkout) und pusht
# nichts - der GITHUB_TOKEN bekommt deshalb ausdruecklich nur Leserechte statt
# der Repo-/Org-Standardrechte.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Python einrichten
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Test- und Lint-Abhängigkeiten installieren
        run: pip install -r requirements-test.txt

      - name: Tests ausführen
        run: pytest -v

      - name: Linting ausführen
        run: ruff check src/tw_recorder/
