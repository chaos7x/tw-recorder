name: Build and Push Streamlink Recorder Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/Tag (leer lassen für auto-increment)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Erlaubt das Erstellen von Releases
      packages: write   # Erlaubt das Pushen in die GitHub Container Registry

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nötig für vollständige Git-Historie und Tag-Prüfung

      - name: Version berechnen & Upstream-Änderungen prüfen
        id: bump_version
        run: |
          # 1. Neuesten eigenen Tag und dessen Commit-Hash ermitteln
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$LATEST_TAG" ]; then
            TAG_COMMIT=$(git rev-parse "$LATEST_TAG^{commit}" 2>/dev/null || echo "")
          else
            TAG_COMMIT=""
            LATEST_TAG="v1.0.0"
          fi

          HEAD_COMMIT=$(git rev-parse HEAD)

          echo "Letzter eigener Tag: $LATEST_TAG ($TAG_COMMIT)"
          echo "Aktueller HEAD: $HEAD_COMMIT"

          # 2. Upstream-Hashes / Versionen ermitteln
          DEBIAN_DIGEST=$(docker manifest inspect debian:trixie-slim 2>/dev/null | grep -m 1 "digest" | awk -F '"' '{print $4}' || echo "")
          FFMPEG_DIGEST=$(docker manifest inspect mwader/static-ffmpeg:latest 2>/dev/null | grep -m 1 "digest" | awk -F '"' '{print $4}' || echo "")
          STREAMLINK_VERSION=$(curl -s https://pypi.org/pypi/streamlink/json | jq -r '.info.version' 2>/dev/null || echo "")

          echo "Debian Digest: $DEBIAN_DIGEST"
          echo "FFmpeg Digest: $FFMPEG_DIGEST"
          echo "Streamlink PyPI Version: $STREAMLINK_VERSION"

          # Fingerprint NUR auf Upstream-Quellen basieren (nicht auf HEAD_COMMIT)
          CURRENT_FINGERPRINT=$(echo "${DEBIAN_DIGEST}:${FFMPEG_DIGEST}:${STREAMLINK_VERSION}" | sha256sum | awk '{print $1}')
          echo "Aktueller System-Fingerprint: $CURRENT_FINGERPRINT"

          # 3. Bei Cronjob den Fingerprint des letzten Releases abgleichen
          SKIP_BUILD="false"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$LATEST_TAG" ]; then
            LAST_RELEASE_BODY=$(gh release view "$LATEST_TAG" --json body -q ".body" 2>/dev/null || echo "")
            LAST_FINGERPRINT=$(echo "$LAST_RELEASE_BODY" | grep -o 'Fingerprint: [a-f0-9]*' | awk '{print $2}' || echo "")

            echo "Letzter Release-Fingerprint: $LAST_FINGERPRINT"

            if [ -n "$LAST_FINGERPRINT" ] && [ "$CURRENT_FINGERPRINT" = "$LAST_FINGERPRINT" ]; then
              echo "Keine Änderungen in Upstream-Quellen (Debian/FFmpeg/Streamlink PyPI). Abbruch."
              SKIP_BUILD="true"
            fi
          fi

          if [ "$SKIP_BUILD" = "true" ]; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 4. Ziel-Version bestimmen
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TARGET_VERSION="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            TARGET_VERSION="${{ inputs.version }}"
          else
            CLEAN_TAG="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
            PATCH=$(echo "$PATCH" | grep -o '^[0-9]*')
            NEW_PATCH=$((PATCH + 1))
            TARGET_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          echo "Bauen mit Ziel-Version: $TARGET_VERSION"
          echo "version=$TARGET_VERSION" >> $GITHUB_OUTPUT
          echo "fingerprint=$CURRENT_FINGERPRINT" >> $GITHUB_OUTPUT
          echo "skip_build=false" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in zur GitHub Container Registry
        if: steps.bump_version.outputs.skip_build != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadaten extrahieren
        if: steps.bump_version.outputs.skip_build != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.bump_version.outputs.version }}
            type=raw,value=latest

      - name: Set up QEMU
        if: steps.bump_version.outputs.skip_build != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.bump_version.outputs.skip_build != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build und Push Docker Image (Multi-Arch)
        if: steps.bump_version.outputs.skip_build != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release & Git-Tag erstellen
        if: steps.bump_version.outputs.skip_build != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.version }}
          name: Release ${{ steps.bump_version.outputs.version }}
          body: |
            Automated Release ${{ steps.bump_version.outputs.version }}
            Fingerprint: ${{ steps.bump_version.outputs.fingerprint }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
