name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/Tag (leer lassen für auto-increment)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.bump_version.outputs.version }}
      is_os_patch: ${{ steps.bump_version.outputs.is_os_patch }}

    strategy:
      matrix:
        include:
          - dockerfile: ./Dockerfile
            suffix: ""
          - dockerfile: ./Dockerfile.alpine
            suffix: "-alpine"

    steps:
      - name: Datum ermitteln
        id: date
        run: echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version berechnen (Auto-Increment Patch)
        id: bump_version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Letzter bekannter Tag: $LATEST_TAG"

          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TARGET_VERSION="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            TARGET_VERSION="${{ inputs.version }}"
          else
            CLEAN_TAG="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
            PATCH=$(echo "$PATCH" | grep -o '^[0-9]*')
            NEW_PATCH=$((PATCH + 1))
            TARGET_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          echo "Bauen mit Ziel-Version: $TARGET_VERSION"
          echo "version=$TARGET_VERSION" >> $GITHUB_OUTPUT

          # Eine vierte Versionsstelle (vX.Y.Z.N) ist ausschliesslich fuer
          # os-patch-release.yml's monatliche, rein OS-Patch-getriebene
          # Releases reserviert (siehe dortiger Kommentar) - da sich dabei
          # nur das Docker-Basis-Image aendert, nicht dieses Package, waere
          # ein erneuter .deb-Build reines Rauschen (identischer Inhalt,
          # neue Versionsnummer).
          DOT_COUNT=$(grep -o "\." <<< "$TARGET_VERSION" | wc -l)
          if [ "$DOT_COUNT" -ge 3 ]; then
            echo "is_os_patch=true" >> $GITHUB_OUTPUT
          else
            echo "is_os_patch=false" >> $GITHUB_OUTPUT
          fi

      - name: Log in zur GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadaten extrahieren
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.bump_version.outputs.version }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag-Namen definieren
        id: vars
        run: |
          echo "IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.bump_version.outputs.version }}${{ matrix.suffix }}" >> $GITHUB_ENV
          echo "LATEST_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest${{ matrix.suffix }}" >> $GITHUB_ENV

      - name: Build und Push Docker Image (Multi-Arch)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ env.IMAGE_TAG }},${{ env.LATEST_TAG }}
          provenance: false
          build-args: |
            VERSION=${{ steps.bump_version.outputs.version }}
            BUILD_DATE=${{ steps.date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release & Git-Tag erstellen
        if: matrix.suffix == '' # Verhindert, dass das Release doppelt erstellt wird
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump_version.outputs.version }}
          name: Release ${{ steps.bump_version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.is_os_patch != 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: fpm installieren
        run: sudo gem install --no-document fpm

      - name: Package per pip in ein Zielverzeichnis installieren
        run: python3 -m pip install --no-deps --no-cache-dir --target=install .

      - name: .deb-Verzeichnisstruktur aufbauen
        run: |
          VERSION="${{ needs.build-and-push.outputs.version }}"
          echo "DEB_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

          # Shebang auf den System-Python fixen - pip schreibt sonst den
          # Interpreter-Pfad DIESES Runners rein, der auf einer echten
          # Debian/Ubuntu-Installation nicht existiert.
          sed -i '1s|.*|#!/usr/bin/python3|' install/bin/tw-recorder
          rm -rf install/tw_recorder/__pycache__

          # /usr/lib/python3/dist-packages statt eines eigenen PYTHONPATH-
          # Verzeichnisses (wie im Dockerfile) - das ist bei einem .deb der
          # Standard-Suchpfad von Debians System-Python, das Package ist
          # damit ohne zusätzliche Umgebungsvariablen importierbar.
          mkdir -p pkgroot/usr/bin pkgroot/usr/lib/python3/dist-packages pkgroot/etc/tw-recorder/conf.d pkgroot/usr/lib/systemd/system pkgroot/etc/init.d pkgroot/etc/logrotate.d
          cp install/bin/tw-recorder pkgroot/usr/bin/tw-recorder
          chmod 755 pkgroot/usr/bin/tw-recorder
          cp -r install/tw_recorder pkgroot/usr/lib/python3/dist-packages/tw_recorder
          cp -r install/tw_recorder-*.dist-info pkgroot/usr/lib/python3/dist-packages/
          cp recorder.conf.example pkgroot/etc/tw-recorder/recorder.conf
          cp tw-recorder.service pkgroot/usr/lib/systemd/system/tw-recorder.service
          # /etc/init.d-Fallback fuer Nicht-systemd-Hosts (Devuan, Debian mit
          # sysvinit-core) - siehe postinst.sh fuer die Registrierung.
          cp init.d/tw-recorder pkgroot/etc/init.d/tw-recorder
          chmod 755 pkgroot/etc/init.d/tw-recorder
          # Nur relevant, wenn ein klassischer Syslog-Daemon laeuft (siehe
          # logging_setup.setup_logging()) - der Datei-Handler rotiert dann
          # bewusst selbst NICHT mehr, das uebernimmt logrotate.
          cp logrotate.d/tw-recorder pkgroot/etc/logrotate.d/tw-recorder

      - name: .deb bauen
        run: |
          fpm -s dir -t deb -f \
            -n tw-recorder \
            -v "$DEB_VERSION" \
            -a all \
            --license GPL-3.0 \
            --maintainer "chaos7x" \
            --description "Multi-Channel Twitch-Stream-Recorder (Streamlink + FFmpeg)" \
            --url "https://github.com/${{ github.repository }}" \
            --depends python3 \
            --depends streamlink \
            --depends ffmpeg \
            --depends adduser \
            --config-files /etc/tw-recorder/recorder.conf \
            --config-files /etc/logrotate.d/tw-recorder \
            --after-install postinst.sh \
            --before-remove prerm.sh \
            --after-remove postrm.sh \
            -C pkgroot \
            usr etc

      - name: .deb als Release-Asset hochladen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-and-push.outputs.version }}
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
