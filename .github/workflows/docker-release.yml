name: Build and Push tw-recorder Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '.github/workflows/**'
      - '**.md'
      - '.gitignore'
      - '.dockerignore'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/Tag (leer lassen für auto-increment)'
        required: false
        default: ''

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/tw-recorder

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version berechnen & Upstream-Änderungen prüfen
        id: bump_version
        run: |
          # 1. Neuesten eigenen Tag und dessen Commit-Hash ermitteln
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$LATEST_TAG" ]; then
            TAG_COMMIT=$(git rev-parse "$LATEST_TAG^{commit}" 2>/dev/null || echo "")
          else
            TAG_COMMIT=""
            LATEST_TAG="v1.0.0"
          fi

          HEAD_COMMIT=$(git rev-parse HEAD)

          echo "Letzter eigener Tag: $LATEST_TAG ($TAG_COMMIT)"
          echo "Aktueller HEAD: $HEAD_COMMIT"

          # 2. Upstream-Digests via Docker Hub API abfragen
          echo "Frage Debian trixie-slim Digest von Docker Hub ab..."
          DEBIAN_DIGEST=$(curl -s "https://registry.hub.docker.com/v2/library/debian/manifests/trixie-slim" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            2>/dev/null | grep -o '"digest":"sha256:[a-f0-9]*"' | head -1 | awk -F '"' '{print $4}' || echo "")
          
          # Fallback mit jq
          if [ -z "$DEBIAN_DIGEST" ]; then
            DEBIAN_DIGEST=$(curl -s "https://registry.hub.docker.com/v2/library/debian/manifests/trixie-slim" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              2>/dev/null | jq -r '.config.digest' 2>/dev/null || echo "")
          fi
          
          if [ -z "$DEBIAN_DIGEST" ]; then
            echo "WARNUNG: Konnte Debian Digest nicht abrufen!"
            DEBIAN_DIGEST="unknown"
          fi
          
          echo "Debian trixie-slim Digest: $DEBIAN_DIGEST"

          echo "Frage mwader/static-ffmpeg Digest von Docker Hub ab..."
          FFMPEG_DIGEST=$(curl -s "https://registry.hub.docker.com/v2/mwader/static-ffmpeg/manifests/latest" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            2>/dev/null | grep -o '"digest":"sha256:[a-f0-9]*"' | head -1 | awk -F '"' '{print $4}' || echo "")
          
          if [ -z "$FFMPEG_DIGEST" ]; then
            FFMPEG_DIGEST=$(curl -s "https://registry.hub.docker.com/v2/mwader/static-ffmpeg/manifests/latest" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              2>/dev/null | jq -r '.config.digest' 2>/dev/null || echo "")
          fi
          
          if [ -z "$FFMPEG_DIGEST" ]; then
            echo "WARNUNG: Konnte FFmpeg Digest nicht abrufen!"
            FFMPEG_DIGEST="unknown"
          fi
          
          echo "FFmpeg mwader/static-ffmpeg Digest: $FFMPEG_DIGEST"

          echo "Frage neueste Streamlink-Version von PyPI ab..."
          STREAMLINK_VERSION=$(curl -s https://pypi.org/pypi/streamlink/json 2>/dev/null | jq -r '.info.version' 2>/dev/null || echo "")
          
          if [ -z "$STREAMLINK_VERSION" ]; then
            echo "WARNUNG: Konnte Streamlink Version nicht abrufen!"
            STREAMLINK_VERSION="unknown"
          fi
          
          echo "Streamlink (neueste PyPI Version): $STREAMLINK_VERSION"

          # Kombinierter Fingerprint
          CURRENT_FINGERPRINT=$(echo "${DEBIAN_DIGEST}:${FFMPEG_DIGEST}:${STREAMLINK_VERSION}" | sha256sum | awk '{print $1}')
          echo "Aktueller System-Fingerprint: $CURRENT_FINGERPRINT"

          # 3. Bei Cronjob: Fingerprint-Vergleich
          SKIP_BUILD="false"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$LATEST_TAG" ]; then
            LAST_RELEASE_BODY=$(gh release view "$LATEST_TAG" --json body -q ".body" 2>/dev/null || echo "")
            LAST_FINGERPRINT=$(echo "$LAST_RELEASE_BODY" | grep -o 'Fingerprint: [a-f0-9]*' | awk '{print $2}' || echo "")

            echo "Letzter Release-Fingerprint: $LAST_FINGERPRINT"

            if [ -n "$LAST_FINGERPRINT" ] && [ "$CURRENT_FINGERPRINT" = "$LAST_FINGERPRINT" ]; then
              echo "Keine Änderungen in Upstream-Quellen (Debian/FFmpeg/Streamlink). Abbruch."
              SKIP_BUILD="true"
            fi
          fi

          if [ "$SKIP_BUILD" = "true" ]; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 4. Ziel-Version bestimmen
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TARGET_VERSION="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            TARGET_VERSION="${{ inputs.version }}"
          else
            CLEAN_TAG="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_TAG"
            PATCH=$(echo "$PATCH" | grep -o '^[0-9]*')
            NEW_PATCH=$((PATCH + 1))
            TARGET_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          echo "Bauen mit Ziel-Version: $TARGET_VERSION"
          echo "version=$TARGET_VERSION" >> $GITHUB_OUTPUT
          echo "fingerprint=$CURRENT_FINGERPRINT" >> $GITHUB_OUTPUT
          echo "skip_build=false" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in zur GitHub Container Registry
        if: steps.bump_version.outputs.skip_build != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in zu Docker Hub
        if: steps.bump_version.outputs.skip_build != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DOCKERHUB }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Metadaten extrahieren
        if: steps.bump_version.outputs.skip_build != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY_DOCKERHUB }}/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.bump_version.outputs.version }}
            type=raw,value=latest

      - name: Set up QEMU
        if: steps.bump_version.outputs.skip_build != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.bump_version.outputs.skip_build != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build und Push Docker Image (Multi-Arch)
        if: steps.bump_version.outputs.skip_build != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release & Git-Tag erstellen
        if: steps.bump_version.outputs.skip_build != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump_version.outputs.version }}
          name: Release ${{ steps.bump_version.outputs.version }}
          body: |
            Automated Release ${{ steps.bump_version.outputs.version }}
            
            Docker Hub: ${{ env.REGISTRY_DOCKERHUB }}/${{ env.DOCKERHUB_IMAGE }}
            GitHub Container Registry: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
            
            Upstream Dependencies:
            - Debian: trixie-slim
            - FFmpeg: mwader/static-ffmpeg:latest
            - Streamlink: ${{ steps.bump_version.outputs.version }}
            
            Fingerprint: ${{ steps.bump_version.outputs.fingerprint }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
